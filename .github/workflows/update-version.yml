name: Auto Update oxidns Version

on:
  schedule:
    # 每天 UTC 02:00 检查（北京时间 10:00）
    - cron: '0 2 * * *'
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get latest release tag from upstream
        id: upstream
        run: |
          # 获取最新 release tag
          LATEST_TAG=$(curl -sL \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/svenshi/oxidns/releases/latest \
            | jq -r '.tag_name')

          if [[ -z "$LATEST_TAG" || "$LATEST_TAG" == "null" ]]; then
            echo "::error::Failed to fetch latest release tag"
            exit 1
          fi

          # 去除 v 前缀：v1.5.2 -> 1.5.2
          NEW_VERSION="${LATEST_TAG#v}"
          echo "latest_tag=${LATEST_TAG}" >> "$GITHUB_OUTPUT"
          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Latest tag: ${LATEST_TAG} (version: ${NEW_VERSION})"

      - name: Get current version from Makefile
        id: current
        run: |
          CURRENT_VERSION=$(grep -oP '^PKG_VERSION:=\K.*' Makefile)
          echo "current_version=${CURRENT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Current version: ${CURRENT_VERSION}"

      - name: Compare versions
        id: compare
        run: |
          if [ "${{ steps.current.outputs.current_version }}" = "${{ steps.upstream.outputs.new_version }}" ]; then
            echo "update_needed=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date."
          else
            echo "update_needed=true" >> "$GITHUB_OUTPUT"
            echo "Update needed: ${{ steps.current.outputs.current_version }} -> ${{ steps.upstream.outputs.new_version }}"
          fi

      - name: Get commit hash for the release tag
        if: steps.compare.outputs.update_needed == 'true'
        id: tag_commit
        run: |
          TAG="${{ steps.upstream.outputs.latest_tag }}"
          # 通过 GitHub API 获取 tag 对应的 commit
          COMMIT_SHA=$(curl -sL \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/svenshi/oxidns/git/ref/tags/${TAG}" \
            | jq -r '.object.sha')

          # 如果 tag 是 annotated（object 类型为 tag），需要再解析一层
          OBJECT_TYPE=$(curl -sL \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/svenshi/oxidns/git/ref/tags/${TAG}" \
            | jq -r '.object.type')

          if [[ "$OBJECT_TYPE" == "tag" ]]; then
            COMMIT_SHA=$(curl -sL \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/svenshi/oxidns/git/tags/${COMMIT_SHA}" \
              | jq -r '.object.sha')
          fi

          if [[ -z "$COMMIT_SHA" || "$COMMIT_SHA" == "null" ]]; then
            echo "::error::Failed to fetch commit hash for tag ${TAG}"
            exit 1
          fi

          echo "commit_hash=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Commit hash: ${COMMIT_SHA}"

      - name: Run update script
        if: steps.compare.outputs.update_needed == 'true'
        run: |
          chmod +x update.sh
          ./update.sh \
            "${{ steps.upstream.outputs.new_version }}" \
            "${{ steps.tag_commit.outputs.commit_hash }}"

      - name: Create Pull Request
        if: steps.compare.outputs.update_needed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "oxidns: update to ${{ steps.upstream.outputs.new_version }}"
          branch: auto-update/oxidns-${{ steps.upstream.outputs.new_version }}
          title: "oxidns: update to ${{ steps.upstream.outputs.new_version }}"
          body: |
            ## Automated version update

            - **Upstream tag:** `${{ steps.upstream.outputs.latest_tag }}`
            - **New version:** `${{ steps.upstream.outputs.new_version }}`
            - **Commit:** `${{ steps.tag_commit.outputs.commit_hash }}`

            This PR was automatically generated by the [update-version workflow](.github/workflows/update-version.yml).
          labels: |
            automated
            version-update
          delete-branch: true